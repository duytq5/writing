<text x="12" y="56" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Ý tưởng chính</text>
<circle cx="670.0" cy="18" r="9" fill="#8250df"/>
<text x="670" y="56" text-anchor="middle" font-size="22" fill="#52606d">Người dùng</text>
<circle cx="810.0" cy="18" r="9" fill="#bf8700"/>
<text x="810" y="56" text-anchor="middle" font-size="22" fill="#52606d">Chuyên gia</text>
<circle cx="950.0" cy="18" r="9" fill="#2563eb"/>
<text x="950" y="56" text-anchor="middle" font-size="22" fill="#52606d">Kỹ sư ML</text>
<circle cx="1090.0" cy="18" r="9" fill="#cf222e"/>
<text x="1090" y="56" text-anchor="middle" font-size="22" fill="#52606d">Quản trị viên</text>
<text x="12" y="103" text-anchor="start" font-size="22" fill="#1f2933">Chẩn đoán trên điện thoại, mô hình mới tự tải về</text>
<circle cx="670.0" cy="95.0" r="11" fill="#8250df"/>
<text x="12" y="153" text-anchor="start" font-size="22" fill="#1f2933">Hệ thống chọn ảnh, chuyên gia chỉ gán ảnh được chọn</text>
<circle cx="810.0" cy="145.0" r="11" fill="#bf8700"/>
<circle cx="950.0" cy="145.0" r="11" fill="#2563eb"/>
<text x="12" y="203" text-anchor="start" font-size="22" fill="#1f2933">Kỹ sư chỉ viết cách huấn luyện, nền tảng lo phần còn lại</text>
<circle cx="950.0" cy="195.0" r="11" fill="#2563eb"/>
<text x="12" y="253" text-anchor="start" font-size="22" fill="#1f2933">Mọi thay đổi phải được duyệt và có lịch sử</text>
<circle cx="950.0" cy="245.0" r="11" fill="#2563eb"/>
<circle cx="1090.0" cy="245.0" r="11" fill="#cf222e"/>
<text x="12" y="303" text-anchor="start" font-size="22" fill="#1f2933">Dữ liệu, mô hình có phiên bản, quay lại được</text>
<circle cx="670.0" cy="295.0" r="11" fill="#8250df"/>
<circle cx="950.0" cy="295.0" r="11" fill="#2563eb"/>
<text x="12" y="353" text-anchor="start" font-size="22" fill="#1f2933">Một cổng đăng nhập, mỗi nhóm một quyền</text>
<circle cx="670.0" cy="345.0" r="11" fill="#8250df"/>
<circle cx="810.0" cy="345.0" r="11" fill="#bf8700"/>
<circle cx="1090.0" cy="345.0" r="11" fill="#cf222e"/>
<text x="12" y="403" text-anchor="start" font-size="22" fill="#1f2933">Xem toàn bộ kho ảnh trên trình duyệt</text>
<circle cx="950.0" cy="395.0" r="11" fill="#2563eb"/>

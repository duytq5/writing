<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 454" width="1160" height="454" font-family="Arial, Liberation Sans, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="530.0" y="0" width="100" height="454" rx="18" fill="#1e5631"/>
<rect x="1" y="28" width="178" height="96" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
<text x="90" y="70" text-anchor="middle" font-size="22" fill="#1f2933">Người dùng</text>
<text x="90" y="98" text-anchor="middle" font-size="22" fill="#1f2933">ứng dụng</text>
<line x1="182" y1="54" x2="528.0" y2="54" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="528.0" y1="98" x2="182" y2="98" stroke="#9aa5b1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="355" y="42" text-anchor="middle" font-size="22" fill="#1f2933"><tspan fill="#2f7d4f" font-weight="bold">đưa vào: </tspan>ảnh chụp lá</text>
<text x="355" y="128" text-anchor="middle" font-size="22" fill="#52606d"><tspan fill="#52606d" font-weight="bold">nhận lại: </tspan>chẩn đoán,</text>
<text x="355" y="156" text-anchor="middle" font-size="22" fill="#52606d">mô hình mới</text>
<rect x="1" y="242" width="178" height="96" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
<text x="90" y="284" text-anchor="middle" font-size="22" fill="#1f2933">Người gán nhãn</text>
<text x="90" y="312" text-anchor="middle" font-size="22" fill="#1f2933">(chuyên gia)</text>
<line x1="182" y1="268" x2="528.0" y2="268" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="528.0" y1="312" x2="182" y2="312" stroke="#9aa5b1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="355" y="256" text-anchor="middle" font-size="22" fill="#1f2933"><tspan fill="#2f7d4f" font-weight="bold">đưa vào: </tspan>nhãn</text>
<text x="355" y="342" text-anchor="middle" font-size="22" fill="#52606d"><tspan fill="#52606d" font-weight="bold">nhận lại: </tspan>ảnh cần gán nhãn</text>
<rect x="981" y="56" width="178" height="96" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
<text x="1070" y="112" text-anchor="middle" font-size="22" fill="#1f2933">Kỹ sư học máy</text>
<line x1="978" y1="82" x2="632.0" y2="82" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="632.0" y1="126" x2="978" y2="126" stroke="#9aa5b1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="805" y="42" text-anchor="middle" font-size="22" fill="#1f2933"><tspan fill="#2f7d4f" font-weight="bold">đưa vào: </tspan>vòng gán nhãn ảnh mới,</text>
<text x="805" y="70" text-anchor="middle" font-size="22" fill="#1f2933">cách huấn luyện, bản phát hành</text>
<text x="805" y="156" text-anchor="middle" font-size="22" fill="#52606d"><tspan fill="#52606d" font-weight="bold">nhận lại: </tspan>tình trạng vòng,</text>
<text x="805" y="184" text-anchor="middle" font-size="22" fill="#52606d">kết quả huấn luyện</text>
<rect x="981" y="298" width="178" height="96" rx="12" fill="#ffffff" stroke="#52606d" stroke-width="2"/>
<text x="1070" y="354" text-anchor="middle" font-size="22" fill="#1f2933">Quản trị viên</text>
<line x1="978" y1="324" x2="632.0" y2="324" stroke="#2f7d4f" stroke-width="2.5" marker-end="url(#ar)"/>
<line x1="632.0" y1="368" x2="978" y2="368" stroke="#9aa5b1" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ar)"/>
<text x="805" y="284" text-anchor="middle" font-size="22" fill="#1f2933"><tspan fill="#2f7d4f" font-weight="bold">đưa vào: </tspan>duyệt thay đổi,</text>
<text x="805" y="312" text-anchor="middle" font-size="22" fill="#1f2933">cấp quyền</text>
<text x="805" y="398" text-anchor="middle" font-size="22" fill="#52606d"><tspan fill="#52606d" font-weight="bold">nhận lại: </tspan>nhật ký:</text>
<text x="805" y="426" text-anchor="middle" font-size="22" fill="#52606d">ai làm gì, khi nào</text>
<text x="580" y="221" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Nền</text>
<text x="580" y="249" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">tảng</text>
</svg>

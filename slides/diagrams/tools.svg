<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 360" width="1160" height="360" font-family="Arial, Liberation Sans, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52606d"/></marker></defs>
<rect x="1" y="1" width="368" height="358" rx="12" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
<rect x="0" y="0" width="370" height="64" rx="8" fill="#1e5631" stroke="#1e5631" stroke-width="2"/>
<text x="185" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">Label Studio</text>
<text x="20" y="108" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Là gì</text>
<text x="20" y="139" text-anchor="start" font-size="22" fill="#1f2933">Công cụ gán nhãn dữ liệu trên</text>
<text x="20" y="166" text-anchor="start" font-size="22" fill="#1f2933">trình duyệt</text>
<text x="20" y="219" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Dùng để</text>
<text x="20" y="250" text-anchor="start" font-size="22" fill="#1f2933">Mỗi job gán nhãn một dự án.</text>
<text x="20" y="277" text-anchor="start" font-size="22" fill="#1f2933">Chuyên gia xác nhận hoặc sửa</text>
<text x="20" y="304" text-anchor="start" font-size="22" fill="#1f2933">nhãn gợi ý của mô hình</text>
<rect x="396" y="1" width="368" height="358" rx="12" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
<rect x="395" y="0" width="370" height="64" rx="8" fill="#1e5631" stroke="#1e5631" stroke-width="2"/>
<text x="580" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">MLflow</text>
<text x="415" y="108" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Là gì</text>
<text x="415" y="139" text-anchor="start" font-size="22" fill="#1f2933">Công cụ theo dõi thí nghiệm và</text>
<text x="415" y="166" text-anchor="start" font-size="22" fill="#1f2933">quản lý phiên bản mô hình</text>
<text x="415" y="219" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Dùng để</text>
<text x="415" y="250" text-anchor="start" font-size="22" fill="#1f2933">Ghi tham số, chỉ số của mỗi lần</text>
<text x="415" y="277" text-anchor="start" font-size="22" fill="#1f2933">huấn luyện, lưu các phiên bản</text>
<text x="415" y="304" text-anchor="start" font-size="22" fill="#1f2933">mô hình, đánh dấu bản đang</text>
<text x="415" y="331" text-anchor="start" font-size="22" fill="#1f2933">dùng</text>
<rect x="791" y="1" width="368" height="358" rx="12" fill="#ffffff" stroke="#2f7d4f" stroke-width="2"/>
<rect x="790" y="0" width="370" height="64" rx="8" fill="#1e5631" stroke="#1e5631" stroke-width="2"/>
<text x="975" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#ffffff">FiftyOne</text>
<text x="810" y="108" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Là gì</text>
<text x="810" y="139" text-anchor="start" font-size="22" fill="#1f2933">Công cụ xem và lọc tập dữ liệu</text>
<text x="810" y="166" text-anchor="start" font-size="22" fill="#1f2933">ảnh</text>
<text x="810" y="219" text-anchor="start" font-size="22" font-weight="bold" fill="#52606d">Dùng để</text>
<text x="810" y="250" text-anchor="start" font-size="22" fill="#1f2933">Xem toàn bộ kho ảnh kèm nhãn,</text>
<text x="810" y="277" text-anchor="start" font-size="22" fill="#1f2933">tập, trạng thái và nguồn ảnh, lọc</text>
<text x="810" y="304" text-anchor="start" font-size="22" fill="#1f2933">để chọn ảnh cho job gán nhãn</text>
<text x="810" y="331" text-anchor="start" font-size="22" fill="#1f2933">tiếp theo</text>
</svg>

<text x="127" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">Chuyên gia</text>
<text x="127" y="250" text-anchor="middle" font-size="19" fill="#52606d">người hiểu bệnh trên lá</text>
<text x="352" y="44" text-anchor="start" font-size="22" fill="#1f2933">Chỉ gán những ảnh hệ thống chọn,</text>
<text x="352" y="72" text-anchor="start" font-size="22" fill="#1f2933">không phải lục tìm trong kho ảnh</text>
<text x="352" y="164" text-anchor="start" font-size="22" fill="#1f2933">Thấy sẵn dự đoán của mô hình,</text>
<text x="352" y="192" text-anchor="start" font-size="22" fill="#1f2933">chỉ cần xác nhận hoặc sửa</text>
<text x="352" y="284" text-anchor="start" font-size="22" fill="#1f2933">Gán nhãn ngay trên trình duyệt,</text>
<text x="352" y="312" text-anchor="start" font-size="22" fill="#1f2933">đánh dấu được ảnh không phải lá</text>

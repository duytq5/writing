<text x="986" y="178" text-anchor="middle" font-size="22" fill="#1f2933">3  Gán nhãn</text>
</g>
<g>
<rect x="826" y="260" width="320" height="60" rx="10" fill="#e7f0fd" stroke="#2563eb" stroke-width="2"/>
<text x="986" y="298" text-anchor="middle" font-size="22" fill="#1f2933">4  Huấn luyện và phát hành</text>
</g>
<g>
<rect x="826" y="380" width="320" height="60" rx="10" fill="#e7f0fd" stroke="#2563eb" stroke-width="2"/>
<text x="986" y="418" text-anchor="middle" font-size="22" fill="#1f2933">4  Huấn luyện và phát hành</text>
</g>
<text x="127" y="282" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">Kỹ sư</text>
<text x="127" y="310" text-anchor="middle" font-size="19" fill="#52606d">người vận hành nền tảng</text>
<text x="352" y="44" text-anchor="start" font-size="22" fill="#1f2933">Xem mọi ảnh gửi về,</text>
<text x="352" y="72" text-anchor="start" font-size="22" fill="#1f2933">cả ảnh đã và chưa có nhãn</text>
<text x="352" y="164" text-anchor="start" font-size="22" fill="#1f2933">Chọn chiến lược và số ảnh</text>
<text x="352" y="192" text-anchor="start" font-size="22" fill="#1f2933">cho mỗi lần gán nhãn</text>
<text x="352" y="284" text-anchor="start" font-size="22" fill="#1f2933">So sánh các lần huấn luyện,</text>
<text x="352" y="312" text-anchor="start" font-size="22" fill="#1f2933">chọn ra mô hình tốt nhất</text>
<text x="352" y="404" text-anchor="start" font-size="22" fill="#1f2933">Phát hành mô hình mới cho điện thoại,</text>
<text x="352" y="432" text-anchor="start" font-size="22" fill="#1f2933">quay lại bản cũ khi cần</text>
</svg>

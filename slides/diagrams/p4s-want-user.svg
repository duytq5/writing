<text x="127" y="222" text-anchor="middle" font-size="22" font-weight="bold" fill="#1f2933">Người dùng</text>
<text x="127" y="250" text-anchor="middle" font-size="19" fill="#52606d">người trồng cây</text>
<text x="352" y="44" text-anchor="start" font-size="22" fill="#1f2933">Chụp lá và biết ngay lá bị bệnh gì,</text>
<text x="352" y="72" text-anchor="start" font-size="22" fill="#1f2933">kể cả ở vườn không có mạng</text>
<text x="352" y="164" text-anchor="start" font-size="22" fill="#1f2933">Dùng một ứng dụng cho nhiều loại cây</text>
<text x="352" y="192" text-anchor="start" font-size="22" fill="#1f2933">(cà phê, sầu riêng)</text>
<text x="352" y="284" text-anchor="start" font-size="22" fill="#1f2933">Ứng dụng tự nhận mô hình mới,</text>
<text x="352" y="312" text-anchor="start" font-size="22" fill="#1f2933">đoán đúng hơn theo thời gian</text>
